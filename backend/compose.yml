name: kitchencraft

services:
  api:
    build:
      context: .
      target: development
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/kitchencraft
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-123456789}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-604800}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      FB_API_KEY: ${FB_API_KEY:-}
      FB_AUTH_DOMAIN: ${FB_AUTH_DOMAIN:-}
      FB_PROJECT_ID: ${FB_PROJECT_ID:-}
      FB_STORAGE_BUCKET: ${FB_STORAGE_BUCKET:-}
      FB_MESSAGING_SENDER_ID: ${FB_MESSAGING_SENDER_ID:-}
      FB_APP_ID: ${FB_APP_ID:-}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true

  mongo:
    # MongoDB 8.x cannot boot on Linux kernel 6.19+ (SERVER-121912).
    # Pin the newest maintained 7.0 patch until the upstream incompatibility is fixed.
    image: mongo:7.0.39-jammy
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  api_node_modules:
  mongo_data:
